<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} | {% endif %}CLI Dojo Policies</title>
    <meta name="description" content="{{ site.description }}">
    <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
  </head>
  <body>
    <header class="site-header">
      <div class="site-shell">
        <div class="site-brand">
          <a href="{{ '/' | relative_url }}">CLI Dojo ポリシー</a>
        </div>
        <nav class="site-nav" aria-label="Policy navigation">
          {% assign nav_key = page.nav_key | default: '' %}
          {% if nav_key == 'privacy' %}
            <span class="is-active">プライバシーポリシー</span>
          {% else %}
            <a href="{{ '/privacy-policy/' | relative_url }}">プライバシーポリシー</a>
          {% endif %}
          {% if nav_key == 'terms' %}
            <span class="is-active">利用規約</span>
          {% else %}
            <a href="{{ '/terms/' | relative_url }}">利用規約</a>
          {% endif %}
        </nav>
      </div>
    </header>
    <main class="page">
      {{ content }}
    </main>
  </body>
</html>
